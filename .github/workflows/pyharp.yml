name: pyharp test suite

on:
    pull_request:
    push:
        branches:
            - master
    release:
        types: [published]
    workflow_dispatch:

jobs:
    # ---- Tests ----
    tests:
        name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.11", "3.12", "3.13"]
            fail-fast: false
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Install python dependencies
              run: uv sync --group dev --python ${{ matrix.python-version }}

            - name: Run codespell
              run: uv run codespell

            - name: Run ruff format
              run: uv run ruff format --check

            - name: Run ruff check
              run: uv run ruff check

            - name: Run ty
              run: uv run ty check

            - name: Run pytest
              run: uv run pytest --cov harp

            - name: Build
              run: uv build --all-packages

    # ---- Benchmarks (base vs PR, informational only — never blocks merge) ----
    benchmarks:
        name: Benchmark base vs PR on ${{ matrix.os }}
        if: github.event_name == 'pull_request'
        needs: tests
        permissions:
            contents: read
            pull-requests: write
        strategy:
            matrix:
                os: [ubuntu-latest] # Only run benchmarks on Linux for now...
            fail-fast: false
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Set up shared paths
              run: |
                  echo "BENCH_DIR=${RUNNER_TEMP//\\//}/harp-bench" >> "$GITHUB_ENV"
                  echo "OUT_DIR=${RUNNER_TEMP//\\//}/harp-bench-out" >> "$GITHUB_ENV"

            - name: Benchmark PR (generates the shared corpus)
              run: |
                  mkdir -p "$OUT_DIR"
                  uv sync --group dev
                  uv run harp-benchmark --entries 200000 --runs 5 \
                    --dir "$BENCH_DIR/data" --json "$OUT_DIR/pr.json"

            - name: Benchmark base (reuses the shared corpus)
              continue-on-error: true
              run: |
                  git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
                  BASE_WT="${RUNNER_TEMP//\\//}/harp-base"
                  git worktree add --detach "$BASE_WT" "origin/$GITHUB_BASE_REF"
                  cd "$BASE_WT"
                  uv sync --group dev
                  uv run harp-benchmark --entries 200000 --runs 5 \
                    --dir "$BENCH_DIR/data" --json "$OUT_DIR/base.json"

            - name: Render comparison
              run: |
                  if [ -f "$OUT_DIR/base.json" ]; then
                    uv run harp-benchmark-compare \
                      --base "$OUT_DIR/base.json" --pr "$OUT_DIR/pr.json" \
                      --label "${{ matrix.os }}" --threshold 10 \
                      --out "$OUT_DIR/comment.md"
                  else
                    {
                      echo "<!-- harp-bench:${{ matrix.os }} -->"
                      echo ""
                      echo "## 🏁 Parsing benchmark — base vs PR (${{ matrix.os }})"
                      echo ""
                      echo "_Baseline unavailable: base branch \`$GITHUB_BASE_REF\` does not yet emit"
                      echo "benchmark JSON. Comparison will appear once this tooling lands on the base branch._"
                    } > "$OUT_DIR/comment.md"
                  fi
                  cat "$OUT_DIR/comment.md"

            - name: Upload benchmark artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: benchmark-${{ matrix.os }}
                  path: |
                      ${{ env.OUT_DIR }}/pr.json
                      ${{ env.OUT_DIR }}/base.json
                      ${{ env.OUT_DIR }}/comment.md
                  if-no-files-found: warn

            - name: Post sticky PR comment
              if: github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const marker = `<!-- harp-bench:${{ matrix.os }} -->`;
                      const body = fs.readFileSync(`${process.env.OUT_DIR}/comment.md`, 'utf8');
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner, repo, issue_number,
                      });
                      const existing = comments.find(c => c.body.includes(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                        await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }

    prepare-release:
        runs-on: ubuntu-latest
        name: Set version from release tag
        needs: tests
        if: github.event_name == 'release' && github.event.action == 'published'
        outputs:
            version: ${{ steps.get_version.outputs.version }}

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: master

            - uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Extract version from tag
              id: get_version
              shell: bash
              run: |
                  version=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
                  echo "version=$version" >> $GITHUB_OUTPUT
                  echo "Setting version to: $version"

            - name: Validate version format
              run: uv version ${{ steps.get_version.outputs.version }} --dry-run

            - name: Set version across all workspace packages
              shell: bash
              run: |
                  version="${{ steps.get_version.outputs.version }}"
                  # Discover every workspace member (root + src/packages/*) by its declared
                  # package name so all versions move in lock-step with the release tag.
                  mapfile -t pkgs < <(grep -h '^name = ' pyproject.toml src/packages/*/pyproject.toml | sed -E 's/^name = "(.*)"/\1/')
                  for pkg in "${pkgs[@]}"; do
                    echo "Setting $pkg -> $version"
                    uv version --package "$pkg" "$version"
                  done

            - name: Build
              run: uv build --all-packages

            - name: Remove internal-only packages from dist
              shell: bash
              run: rm -f dist/harp_benchmarks-*

            - name: Upload wheels as artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/

            # This step seems a bit complicated, but it allows for idempotent commits,
            # so that if the release tag is moved to a new commit,
            # the version will be updated and committed again.
            - name: Commit version changes
              shell: bash
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  git diff --cached --quiet && echo "No changes to commit" && exit 0
                  git commit -m "Set version ${{ steps.get_version.outputs.version }} [skip ci]"
                  git push origin master
                  # Move the release tag to point to this new commit.
                  git tag -fa "${{ github.event.release.tag_name }}" -m "${{ github.event.release.tag_name }}"
                  git push origin "${{ github.event.release.tag_name }}" --force

    # ---- Publish to PyPI ----
    publish-to-pypi:
        runs-on: ubuntu-latest
        name: Publish to PyPI
        needs: prepare-release
        steps:
            - name: Download wheels artifact
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Publish to PyPI
              run: uv publish --token ${{ secrets.PYPI_TOKEN }}

            - name: Upload wheels to GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*

    # ---- Docs ----
    build-docs:
        name: Build and deploy documentation to GitHub Pages
        runs-on: ubuntu-latest
        needs: prepare-release
        if: github.event_name == 'release' && !github.event.release.prerelease
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: master

            - name: Install uv
              uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --group docs

            - name: Configure Git user
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Build & Deploy docs
              run: uv run mkdocs gh-deploy --force
