[project]
name = "pyharp"
version = "0.1.0"
description = "Library for data acquisition and control of devices implementing the Harp protocol."
authors = [{ name= "Filipe Carvalho", email="filipe@open-ephys.org"}]
license = "MIT"
readme = 'README.md'
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
