[project]
name = "pyharp"
version = "0.1.0"
description = "Library for data acquisition and control of devices implementing the Harp protocol."
authors = [{ name= "Filipe Carvalho", email="filipe@open-ephys.org"}]
license = "MIT"
readme = 'README.md'
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-codeinclude-plugin>=0.2.1",
    "mkdocs-git-authors-plugin>=0.9.4",
    "mkdocs-git-committers-plugin-2>=2.5.0",
    "mkdocs-material>=9.6.9",
    "mkdocs-monorepo-plugin>=1.1.0",
    "mkdocstrings-python>=1.16.6",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib", ]
python_files = [
    "tests.py",
    "test_*.py"
]
