[project]
name = "harp-device"
version = "0.1.0"
description = "Harp device interfaces — serial and other transports"
requires-python = ">=3.11"
dependencies = [
    "harp-protocol",
    "pyserial>=3.5",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harp.device"
module-root = "src"