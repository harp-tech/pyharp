[project]
name = "harp-serial"
version = "0.1.0"
description = "Serial transport for Harp devices"
requires-python = ">=3.11"
dependencies = [
    "harp-protocol",
    "harp-device",
    "pyserial>=3.5",
]

[build-system]
requires = ["uv_build>=0.9.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harp.serial"
module-root = "src"
