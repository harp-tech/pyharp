[project]
name = "harp-serial"
dynamic = ["version"]
description = "Serial transport for Harp devices"
requires-python = ">=3.11"
dependencies = [
    "harp-protocol",
    "harp-device",
    "pyserial>=3.5",
]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../../.."

[tool.setuptools.packages.find]
where = ["src"]
include = ["harp*"]
