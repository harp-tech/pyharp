[project]
name = "harp-benchmarks"
dynamic = ["version"]
description = "Internal parsing-speed benchmarks for the Harp register/payload API."
requires-python = ">=3.11"
# INTERNAL ONLY — never published to PyPI. The "Private :: Do Not Upload" trove
# classifier is rejected by PyPI (and twine/uv publish), so an accidental upload
# of this distribution fails fast.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "harp-protocol",
    "harp-data",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.scripts]
harp-benchmark = "harp.benchmarks.benchmark:main"
harp-benchmark-generate = "harp.benchmarks.generate:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../../.."

[tool.setuptools.packages.find]
where = ["src"]
include = ["harp*"]
