[project]
name = "harp-data"
dynamic = ["version"]
description = "Load Harp device data into pandas DataFrames"
requires-python = ">=3.11"
dependencies = [
    "harp-protocol",
    "harp-device",
    "numpy>=1.24",
    "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../../.."

[tool.setuptools.packages.find]
where = ["src"]
include = ["harp*"]
