[project]
name = "harp-device"
version = "0.1.0"
description = "Transport-agnostic Harp device protocol layer"
requires-python = ">=3.11"
dependencies = [
    "harp-protocol",
]

[project.optional-dependencies]
rx = ["reactivex>=4"]

[build-system]
requires = ["uv_build>=0.9.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harp.device"
module-root = "src"